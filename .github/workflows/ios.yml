name: iOS build

# macOS CI for the Capacitor iOS shell. This complements the Linux `CI` workflow
# (lint + harnesses + web build) by proving the native App and Widget Extension
# still compile, then executing the hosted FidelisNativeTests suite on iOS 17.5
# and the current iOS 26 simulator. Signing is disabled, so no Apple developer
# account or secrets are needed. The older runtime is downloaded explicitly when
# the newest hosted runner does not already contain it; missing coverage is a hard
# failure, never silently replaced with another OS version.
#
# Runs only when iOS-relevant files change (or on demand) to keep macOS minutes low.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios.yml"
      # Native tooling: project wiring, widget data builders, release pipeline.
      # These shape or feed the Xcode project even though they live in scripts/.
      - "scripts/add-ios-widget-target.rb"
      - "scripts/add-ios-native-test-target.rb"
      - "scripts/configure-ios-app-target.rb"
      - "scripts/verify-ios-widget-wiring.rb"
      - "scripts/build-votd-widget.mjs"
      - "scripts/build-calendar-widget.ts"
      - "scripts/ios-release-contract.ts"
      - "scripts/ios-testflight.sh"
      - "scripts/ios-testflight-dispatch.sh"
      - "scripts/verify-ios-export.ts"
  pull_request:
    paths:
      - "ios/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios.yml"
      - "scripts/add-ios-widget-target.rb"
      - "scripts/add-ios-native-test-target.rb"
      - "scripts/configure-ios-app-target.rb"
      - "scripts/verify-ios-widget-wiring.rb"
      - "scripts/build-votd-widget.mjs"
      - "scripts/build-calendar-widget.ts"
      - "scripts/ios-release-contract.ts"
      - "scripts/ios-testflight.sh"
      - "scripts/ios-testflight-dispatch.sh"
      - "scripts/verify-ios-export.ts"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    # Capacitor 8.4.x ships its iOS framework as a binary xcframework built with
    # Apple Swift 6.2; an older toolchain cannot read its .swiftinterface (it fails
    # with misleading "no member" errors). Use the newest runner image and select
    # the newest installed Xcode so the Swift version is >= the framework's.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version
          swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The project-wiring scripts require xcodeproj directly. Do not depend on
      # whichever Ruby gems happen to be present on the hosted macOS image.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install pinned Xcode project tooling
        run: gem install xcodeproj --version 1.27.0 --no-document

      # Build the web bundle and copy it + the Capacitor plugins into the Xcode
      # project (writes ios/App/App/public, which is gitignored and regenerated).
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      - name: Verify native target and entitlement wiring
        run: |
          ruby scripts/add-ios-widget-target.rb
          ruby scripts/configure-ios-app-target.rb
          ruby scripts/add-ios-native-test-target.rb
          ruby scripts/verify-ios-widget-wiring.rb

      # Surface the available schemes in the log (xcodebuild auto-creates the
      # "App" scheme when none is shared), then resolve the local Swift package.
      - name: List schemes
        run: xcodebuild -list -project ios/App/App.xcodeproj
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      # Build the App target for a generic simulator, signing disabled. Release
      # configuration — the one scripts/ios-testflight.sh archives — so CI proves
      # the same optimization/settings profile that actually ships.
      - name: Build App (iOS Simulator, Release, unsigned)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Install the iOS 17.5 simulator runtime
        run: |
          if ! xcrun simctl list runtimes | grep -q "iOS 17.5"; then
            xcodebuild -downloadPlatform iOS -buildVersion 17.5
          fi
          xcrun simctl list runtimes | grep "iOS 17.5"

      - name: Build hosted native tests
        run: |
          xcodebuild build-for-testing \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/fidelis-ios-native-tests" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Run native tests on iOS 17.5 and current iOS 26
        shell: bash
        run: |
          set -euo pipefail

          runtime_id() {
            xcrun simctl list runtimes -j | /usr/bin/ruby -rjson -e '
              major = ARGV.fetch(0)
              runtimes = JSON.parse(STDIN.read).fetch("runtimes").select do |runtime|
                runtime.fetch("isAvailable", false) && runtime.fetch("version").start_with?("#{major}.")
              end
              abort "No available iOS #{major} simulator runtime" if runtimes.empty?
              selected = runtimes.max_by { |runtime| runtime.fetch("version").split(".").map(&:to_i) }
              puts selected.fetch("identifier")
            ' "$1"
          }

          ios17_runtime="$(runtime_id 17)"
          ios26_runtime="$(runtime_id 26)"
          device_type="com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro"
          ios17_device="$(xcrun simctl create 'Fidelis CI iOS 17' "$device_type" "$ios17_runtime")"
          ios26_device="$(xcrun simctl create 'Fidelis CI iOS 26' "$device_type" "$ios26_runtime")"
          cleanup() {
            xcrun simctl delete "$ios17_device" || true
            xcrun simctl delete "$ios26_device" || true
          }
          trap cleanup EXIT

          mkdir -p "$RUNNER_TEMP/fidelis-ios-native-results"
          for destination in "iOS-17.5:$ios17_device" "iOS-26:$ios26_device"; do
            label="${destination%%:*}"
            udid="${destination#*:}"
            xcodebuild test-without-building \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$udid" \
              -derivedDataPath "$RUNNER_TEMP/fidelis-ios-native-tests" \
              -resultBundlePath "$RUNNER_TEMP/fidelis-ios-native-results/$label.xcresult" \
              -only-testing:FidelisNativeTests \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          done

      - name: Upload native test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fidelis-ios-native-test-results
          path: ${{ runner.temp }}/fidelis-ios-native-results
          if-no-files-found: ignore
