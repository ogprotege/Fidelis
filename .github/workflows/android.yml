name: Android build

# Linux CI for the Capacitor Android shell — the Android counterpart of ios.yml.
# Until now nothing ever compiled android/ (the three App Widget classes, the
# manifest, the Gradle wiring), so a Java or resource regression could rot
# silently between releases. This builds the debug APK, unsigned — no keystore
# or Play credentials needed. AGP 8.13 (android/build.gradle) requires JDK 21;
# Gradle comes from the committed wrapper.
#
# Runs only when Android-relevant files change (or on demand) to keep CI light.
# public/** is included because the whole data corpus ships inside the APK
# (offline by construction), and the widgets read the committed res/raw JSON.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
      # The widget data builders feed the committed res/raw JSON the widgets read.
      - "scripts/build-votd-widget.mjs"
      - "scripts/build-calendar-widget.ts"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
      - "scripts/build-votd-widget.mjs"
      - "scripts/build-calendar-widget.ts"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Build the web bundle and sync it into the Android project. `cap sync`
      # (not just `copy`) is REQUIRED here: it generates the uncommitted
      # android/capacitor-cordova-android-plugins/ subproject (incl.
      # cordova.variables.gradle) that the committed capacitor.build.gradle
      # applies — without it Gradle fails at configure time. The iOS pipelines'
      # copy-not-sync rule guards an iOS-only trap (the Package.swift platform
      # rewrite); on Android, sync's regenerated gradle files are deterministic
      # from the pinned CLI version and the rewrite is ephemeral in CI.
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Android lint and host unit tests
        run: ./gradlew lintDebug testDebugUnitTest --no-daemon
        working-directory: android

      - name: Build debug APK (unsigned)
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

  android-instrumentation:
    name: Android instrumentation (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 proves the manual-install fallback, 26 introduces pin requests,
        # 31 exercises mutable callback PendingIntents, and 36 is current.
        api-level: [24, 26, 31, 36]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run native wiring tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          # Scope to the application module. The generated empty Cordova
          # library subproject has no instrumentation tests and carries an old
          # Kotlin test dependency that conflicts if Gradle assembles its APK.
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon
