name: CI

# Review item §B.3: run the linter, the harnesses, and the build on every pull
# request and every push to main, so a feast that silently moves, a lint error,
# or a type error is caught before it ever reaches a release. One job; the only
# cache is setup-node's built-in npm cache. (`npm test` also runs the linter, so
# the same command gates locally and remotely; the dedicated lint step fails
# fast.) Feature-branch pushes are covered by their pull request — running both
# doubled every CI minute for no extra signal.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # npm 10 falls back to the retired quick-audit endpoint whenever the
      # bulk advisory request fails, which can turn a clean tree into a false
      # 400 "Invalid package tree" failure. npm 11 removed that fallback.
      - name: Pin npm audit client
        run: |
          npm install --global npm@11.17.0 --no-audit --no-fund
          npm --version
      - run: npm ci
      - name: Audit production dependency graph
        run: npm audit --omit=dev
      - name: Audit complete dependency graph
        run: npm audit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check documentation links
        run: npm run check-docs

  # v1.18.1 (audit FID-QUAL-001): the committed browser suite — the behaviors
  # the pure harnesses can't reach (failure states, the action bar, sheets,
  # offline cache truth, import atomicity, axe). Runs the BUILT app through
  # `vite preview` (playwright.config.ts's webServer); channel "chrome" uses
  # the runner's preinstalled Google Chrome, so no browser download.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pin npm install client
        run: |
          npm install --global npm@11.17.0 --no-audit --no-fund
          npm --version
      - run: npm ci
      - run: npm run build
      - name: Browser suite (Playwright)
        run: npm run e2e
